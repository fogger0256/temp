<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp.map v1.2</title> </title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0b0f19; /* 地図が透けたときのダーク背景色 */
      color: #f8fafc;
    }

    /* ヘッダーエリア */
    header {
      background-color: #1e293b;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 1000;
    }
    h1 { font-size: 1.05rem; font-weight: 600; }
    .time-info { font-size: 0.85rem; color: #38bdf8; }

    /* コントロールパネル（切り替えボタン＆スライダー） */
    .control-panel {
      background-color: #0f172a;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      z-index: 1000;
    }

    /* 切り替え用ラジオボタンの装飾 */
    .display-modes {
      display: flex;
      background: #1e293b;
      padding: 4px;
      border-radius: 8px;
    }
    .mode-btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .mode-btn input { display: none; }
    .mode-btn:has(input:checked) {
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
    }

    /* 透明度スライダーの装飾 */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .slider-container input {
      cursor: pointer;
      accent-color: #38bdf8;
    }

    #map-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background-color: #0b0f19; /* 地図透過時のベース色 */
    }
    #map { width: 100%; height: 100%; }

    /* 気温マーカーのデザイン（視認性を向上） */
    .temp-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      color: #ffffff;
      font-weight: bold;
      font-size: 11px;
      padding: 2px 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.9);
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      transition: transform 0.15s ease;
    }
    .temp-marker:hover {
      transform: scale(1.35);
      z-index: 9999 !important;
    }

    /* 凡例パネル */
    .legend-card {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 11px;
    }
    .legend-title { font-weight: bold; margin-bottom: 6px; }
    .legend-gradient {
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, #0d47a1, #1e88e5, #00acc1, #43a047, #fdd835, #fb8c00, #e53935, #8e24aa);
      margin-bottom: 4px;
    }
    .legend-labels { display: flex; justify-content: space-between; color: #cbd5e1; font-size: 9px; gap: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>🌡️ 高視認性・カスタム気温マップ</h1>
    <div class="time-info" id="time-display">データ取得中...</div>
  </header>

  <div class="control-panel">
    <div class="display-modes">
      <label class="mode-btn"><input type="radio" name="mode" value="temp" checked>現在気温</label>
      <label class="mode-btn"><input type="radio" name="mode" value="maxTemp">今日の最高気温</label>
      <label class="mode-btn"><input type="radio" name="mode" value="minTemp">今日の最低気温</label>
    </div>

    <div class="slider-container">
      <span>🗺️ 地図の濃さ:</span>
      <input type="range" id="opacity-slider" min="0.1" max="1.0" step="0.05" value="0.5">
    </div>
  </div>

  <div id="map-container">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. 地図の初期化
    const map = L.map('map').setView([35.2411, 136.7633], 8);

    // データの視認性に最も優れた「CartoDB Positron」レイヤーを採用
    const tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap, © CartoDB | 気象データ: 気象庁'
    }).addTo(map);

    // 初期状態の地図の不透明度を設定（0.5 = 50% で少し薄く）
    tileLayer.setOpacity(0.5);

    // マーカーを管理するレイヤーグループ
    const markerGroup = L.layerGroup().addTo(map);

    // キャッシュ用変数
    let amedasTableCache = null;
    let amedasDataCache = null;

    // 2. 1℃刻みの色分け関数
    function getTempColor(t) {
      if (t === null || t === undefined) return '#64748b';
      const temp = Math.round(t);
      if (temp <= -10) return '#0d47a1'; 
      if (temp <= -5)  return '#1565c0';
      if (temp <= 0)   return '#1e88e5'; 
      if (temp <= 5)   return '#00acc1'; 
      if (temp <= 10)  return '#00897b'; 
      if (temp <= 15)  return '#43a047'; 
      if (temp <= 20)  return '#7cb342'; 
      if (temp <= 25)  return '#fdd835'; 
      if (temp <= 28)  return '#fb8c00'; 
      if (temp <= 30)  return '#f57c00'; 
      if (temp <= 33)  return '#e65100'; 
      if (temp <= 35)  return '#e53935'; 
      if (temp <= 38)  return '#d81b60'; 
      return '#8e24aa';                 
    }

    // 凡例表示
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
      const div = L.DomUtil.create('div', 'legend-card');
      div.innerHTML = `
        <div class="legend-title">1℃刻み カラー判定</div>
        <div class="legend-gradient"></div>
        <div class="legend-labels"><span>-10℃以下</span><span>0℃</span><span>15℃</span><span>25℃</span><span>35℃以上</span></div>
      `;
      return div;
    };
    legend.addTo(map);

    // 3. マーカーの描画・更新処理
    function renderMarkers() {
      markerGroup.clearLayers();
      if (!amedasTableCache || !amedasDataCache) return;

      // 現在選択されているモードを取得 (temp, maxTemp, minTemp)
      const currentMode = document.querySelector('input[name="mode"]:checked').value;
      let labelText = '現在気温';
      if (currentMode === 'maxTemp') labelText = '今日の最高気温';
      if (currentMode === 'minTemp') labelText = '今日の最低気温';

      let count = 0;
      Object.keys(amedasDataCache).forEach(id => {
        const station = amedasTableCache[id];
        const obs = amedasDataCache[id];

        // 選択されたモードのデータが存在するかチェック
        if (station && obs && obs[currentMode]) {
          const tempVal = obs[currentMode][0]; // 気温値を取得
          
          const lat = station.lat[0] + station.lat[1] / 60;
          const lon = station.lon[0] + station.lon[1] / 60;
          const name = station.kjName || '観測地点';
          const bgColor = getTempColor(tempVal);

          const icon = L.divIcon({
            className: 'custom-icon',
            html: `<div class="temp-marker" style="background-color: ${bgColor};">${tempVal.toFixed(1)}°</div>`,
            iconSize: [42, 20],
            iconAnchor: [21, 10]
          });

          L.marker([lat, lon], { icon: icon })
            .addTo(markerGroup)
            .bindPopup(`<strong>${name}</strong><br>${labelText}: <strong>${tempVal.toFixed(1)} ℃</strong>`);
          
          count++;
        }
      });
    }

    // 4. データ取得処理
    async function fetchWeatherData() {
      const timeDisplay = document.getElementById('time-display');
      try {
        const timeRes = await fetch('https://www.jma.go.jp/bosai/amedas/data/latest_time.txt');
        if (!timeRes.ok) throw new Error('時刻取得失敗');
        const rawTimeText = (await timeRes.text()).trim(); 
        const latestTime = rawTimeText.replace(/[-T:+]/g, '').slice(0, 14);

        const [tableRes, dataRes] = await Promise.all([
          fetch('https://www.jma.go.jp/bosai/amedas/const/amedastable.json'),
          fetch(`https://www.jma.go.jp/bosai/amedas/data/map/${latestTime}.json`)
        ]);

        amedasTableCache = await tableRes.json();
        amedasDataCache = await dataRes.json();

        // 初回描画
        renderMarkers();

        const y = latestTime.slice(0, 4); const m = latestTime.slice(4, 6); const d = latestTime.slice(6, 8);
        const hh = latestTime.slice(8, 10); const mm = latestTime.slice(10, 12);
        timeDisplay.textContent = `最終更新: ${y}/${m}/${d} ${hh}:${mm}`;

      } catch (err) {
        timeDisplay.textContent = `⚠️ エラー: ${err.message}`;
        timeDisplay.style.color = '#f87171';
      }
    }

    // 5. イベントリスナーの設定
    // 地図の透明度スライダーが動いたとき
    document.getElementById('opacity-slider').addEventListener('input', (e) => {
      tileLayer.setOpacity(parseFloat(e.target.value));
    });

    // 切り替えボタン（ラジオボタン）が押されたとき
    document.querySelectorAll('input[name="mode"]').forEach(radio => {
      radio.addEventListener('change', renderMarkers);
    });

    // 初回実行
    fetchWeatherData();
  </script>
</body>
</html>
