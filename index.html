<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEMP.map Ver 1.1</title>
  
  <!-- 地図ライブラリ Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
    }

    /* ヘッダーエリア */
    header {
      background-color: #1e293b;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 1000;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .time-info {
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: 500;
    }

    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* 気温マーカーのデザイン */
    .temp-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      color: #ffffff;
      font-weight: bold;
      font-size: 11px;
      padding: 2px 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.8);
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
      transition: transform 0.15s ease;
    }
    .temp-marker:hover {
      transform: scale(1.3);
      z-index: 9999 !important;
    }

    /* 凡例パネル */
    .legend-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 11px;
      max-width: 280px;
    }
    .legend-title {
      font-weight: bold;
      margin-bottom: 6px;
    }
    .legend-gradient {
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, 
        #0d47a1, #1e88e5, #00acc1, #43a047, 
        #fdd835, #fb8c00, #e53935, #8e24aa
      );
      margin-bottom: 4px;
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
      font-size: 9px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌡️ カスタム気温マップ</h1>
    <div class="time-info" id="time-display">データ取得準備中...</div>
  </header>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. 地図の初期化
    const map = L.map('map').setView([35.2411, 136.7633], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | 気象データ: 気象庁'
    }).addTo(map);

    // 2. 1℃刻みの色分け関数
    function getTempColor(t) {
      if (t === null || t === undefined) return '#64748b';
      const temp = Math.round(t);

      if (temp <= -10) return '#0d47a1'; 
      if (temp <= -5)  return '#1565c0';
      if (temp <= 0)   return '#1e88e5'; 
      if (temp <= 5)   return '#00acc1'; 
      if (temp <= 10)  return '#00897b'; 
      if (temp <= 15)  return '#43a047'; 
      if (temp <= 20)  return '#7cb342'; 
      if (temp <= 25)  return '#fdd835'; 
      if (temp <= 28)  return '#fb8c00'; 
      if (temp <= 30)  return '#f57c00'; 
      if (temp <= 33)  return '#e65100'; 
      if (temp <= 35)  return '#e53935'; 
      if (temp <= 38)  return '#d81b60'; 
      return '#8e24aa';                 
    }

    // 凡例表示
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
      const div = L.DomUtil.create('div', 'legend-card');
      div.innerHTML = `
        <div class="legend-title">1℃刻み カラー判定スケール</div>
        <div class="legend-gradient"></div>
        <div class="legend-labels">
          <span>-10℃以下</span>
          <span>0℃</span>
          <span>15℃</span>
          <span>25℃</span>
          <span>35℃以上</span>
        </div>
      `;
      return div;
    };
    legend.addTo(map);

    // 3. データ取得メイン処理
    async function fetchWeatherData() {
      const timeDisplay = document.getElementById('time-display');
      try {
        timeDisplay.textContent = '最新時刻を取得中...';

        // ① 最新時刻ファイルの取得 (.txt で取得しISO日時を解析)
        const timeRes = await fetch('https://www.jma.go.jp/bosai/amedas/data/latest_time.txt');
        if (!timeRes.ok) throw new Error(`時刻ファイル取得失敗 (${timeRes.status})`);
        
        const rawTimeText = (await timeRes.text()).trim(); 
        // ISO形式 (例: "2026-07-20T16:40:00+09:00") から数字14桁 (YYYYMMDDHHMMSS) を抽出
        const latestTime = rawTimeText.replace(/[-T:+]/g, '').slice(0, 14);

        // 表示用フォーマット
        const y = latestTime.slice(0, 4);
        const m = latestTime.slice(4, 6);
        const d = latestTime.slice(6, 8);
        const hh = latestTime.slice(8, 10);
        const mm = latestTime.slice(10, 12);

        // ② 観測所一覧と最新気温データの取得
        timeDisplay.textContent = '気温データをダウンロード中...';
        const [tableRes, dataRes] = await Promise.all([
          fetch('https://www.jma.go.jp/bosai/amedas/const/amedastable.json'),
          fetch(`https://www.jma.go.jp/bosai/amedas/data/map/${latestTime}.json`)
        ]);

        if (!tableRes.ok) throw new Error(`観測所一覧取得失敗 (${tableRes.status})`);
        if (!dataRes.ok) throw new Error(`アメダスデータ取得失敗 (${dataRes.status})`);

        const amedasTable = await tableRes.json();
        const amedasData = await dataRes.json();

        // ③ マーカーを描画
        let count = 0;
        Object.keys(amedasData).forEach(id => {
          const station = amedasTable[id];
          const obs = amedasData[id];

          if (station && obs && obs.temp) {
            const tempVal = obs.temp[0]; // 気温(℃)
            const lat = station.lat[0] + station.lat[1] / 60;
            const lon = station.lon[0] + station.lon[1] / 60;
            const name = station.kjName || '観測地点';
            const bgColor = getTempColor(tempVal);

            const icon = L.divIcon({
              className: 'custom-icon',
              html: `<div class="temp-marker" style="background-color: ${bgColor};">${tempVal.toFixed(1)}°</div>`,
              iconSize: [42, 20],
              iconAnchor: [21, 10]
            });

            L.marker([lat, lon], { icon: icon })
              .addTo(map)
              .bindPopup(`<strong>${name}</strong><br>現在気温: <strong>${tempVal.toFixed(1)} ℃</strong>`);
            
            count++;
          }
        });

        timeDisplay.textContent = `観測時刻: ${y}/${m}/${d} ${hh}:${mm} (${count}地点表示)`;

      } catch (err) {
        console.error('詳細エラー:', err);
        timeDisplay.textContent = `⚠️ データ取得エラー: ${err.message}`;
        timeDisplay.style.color = '#f87171';
      }
    }

    fetchWeatherData();
  </script>
</body>
</html>
